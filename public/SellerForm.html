<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayass-sankalp</title>
    <style>
        .refurbished-form {
            display: none;
        }
    </style>
</head>
<body>

<h1>Sell Your Excess Food or Refurbished Products at Prayass_sankalp</h1>

<form id="typeSelectionForm">
    <label>
        <input type="radio" name="sellingType" value="food" checked> Sell Excess Food
    </label>
    <label>
        <input type="radio" name="sellingType" value="refurbished"> Sell Refurbished Products
    </label>
</form>

<form id="foodForm" action="/submitSellerForm/sellers" method="post" enctype="multipart/form-data">

    <div class="form-group">
        <label for="foodName">Name:</label>
        <input type="text" id="foodName" name="Name" placeholder="Enter Your Name">
    </div>
    <div class="form-group">
        <label for="PhoneNo">PhoneNo:</label>
        <input type="number" id="PhoneNo" name="PhoneNo" placeholder="Enter Your PhoneNo">
    </div>
    <div class="form-group">
        <label for="location">Location:</label>
        <input type="text" id="location" name="location" placeholder="Enter city or pincode">
    </div>
    <div class="form-group">
        <label for="category">Category:</label>
        <select id="category" name="category">
            <option value="">Select a category</option>
            <option value="South Indian">South Indian</option>
            <option value="North Indian">North Indian</option>
            <option value="Chinese">Chinese</option>
            <option value="Fast Food">Fast Food</option>
            <option value="Beverages">Beverages</option>
            <option value="Desserts/Sweets">Desserts/Sweets</option>
        </select>
    </div>
    <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" placeholder="Enter product title">
    </div>
    <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" name="description" placeholder="Enter product description"></textarea><br>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" placeholder="Enter quantity">
    </div>
    <div class="form-group">
        <label for="netWeight">Net Weight:</label>
        <input type="text" id="netWeight" name="netWeight" placeholder="(i.e, 10kg and 450 grams)">
    </div>

    <div class="form-group">
        <label for="price">Price:</label>
        <input type="number" name="price" id="price" placeholder="Enter price in Rupees">
        <br>
        <input type="checkbox" name="zeroPrice" id="zeroPrice" onclick="lockPrice()"> Donate
        <br>
    </div>

    <div class="form-group">
        <label for="foodImage">Food Image:</label>
        <input type="file" id="foodImage" name="foodImage" accept="image/*">
    </div>

    <button type="submit">Submit</button>
</form>

<form id="refurbishedForm" action="/submitSellerForm/refurbishedproducts" method="post" class="refurbished-form" enctype="multipart/form-data">
    <div class="form-group">
        <label for="refurbishedName">Name:</label>
        <input type="text" id="refurbishedName" name="Name" placeholder="Enter Your Name">
    </div>
    <div class="form-group">
        <label for="locationRefurbished">Location:</label>
        <input type="text" id="locationRefurbished" name="location" placeholder="Enter city or pincode">
    </div>
    <div class="form-group">
        <label for="categoryRefurbished">Category:</label>
        <select id="categoryRefurbished" name="category">
            <option value="">Select a category</option>
            <option value="Books">Books and Stationary</option>
            <option value="Clothes">Clothes</option>
            <option value="Furniture">Furniture</option>
            <option value="Electronics">Electronics</option>
            <option value="Sports">Sports</option>
            <option value="Others">Others</option>
        </select>
    </div>
    <div class="form-group">
        <label for="titleRefurbished">Title:</label>
        <input type="text" id="titleRefurbished" name="title" placeholder="Enter product title">
    </div>
    <div class="form-group">
        <label for="descriptionRefurbished">Description:</label>
        <textarea id="descriptionRefurbished" name="description" placeholder="Enter product description"></textarea><br>
        <label for="quantityRefurbished">Quantity:</label>
        <input type="number" id="quantityRefurbished" name="quantity" placeholder="Enter quantity">
    </div>

    <div class="form-group">
        <label for="priceRefurbished">Price:</label>
        <input type="number" name="price" id="priceRefurbished" placeholder="Enter price in Rupees">
        <br>
        <input type="checkbox" name="zeroPriceRefurbished" id="zeroPriceRefurbished" onclick="lockPriceRefurbished()"> Donate
        <br>
    </div>

    <div class="form-group">
        <label for="productImageRefurbished">Product Image:</label>
        <input type="file" id="productImageRefurbished" name="productImage" accept="image/*">
    </div>

    <button type="submit">Submit</button>
</form>

<script>
    function lockPrice() {
        const priceInput = document.getElementById('price');
        const zeroPriceCheckbox = document.getElementById('zeroPrice');

        if (zeroPriceCheckbox.checked) {
            priceInput.value = '0';
            priceInput.disabled = true;
        } else {
            priceInput.disabled = false;
        }
    }

    function lockPriceRefurbished() {
        const priceInput = document.getElementById('priceRefurbished');
        const zeroPriceCheckbox = document.getElementById('zeroPriceRefurbished');

        if (zeroPriceCheckbox.checked) {
            priceInput.value = '0';
            priceInput.disabled = true;
        } else {
            priceInput.disabled = false;
        }
    }

    const typeSelectionForm = document.getElementById('typeSelectionForm');
    const refurbishedForm = document.getElementById('refurbishedForm');
    const foodForm = document.getElementById('foodForm');

    typeSelectionForm.addEventListener('change', function () {
        if (document.querySelector('input[name="sellingType"]:checked').value === 'food') {
            refurbishedForm.style.display = 'none';
            foodForm.style.display = 'block';
        } else {
            refurbishedForm.style.display = 'block';
            foodForm.style.display = 'none';
        }
    });
</script>

</body>
</html>
